<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/edit_password.css') }}">
</head>
<body>
    <h2>Edit Password</h2>
    <form method="POST">
        <input type="text" name="site_name" value="{{ entry.site_name }}" required><br>
        <input type="text" name="site_username" value="{{ entry.site_username }}" required><br>
        <input type="text" name="site_password" value="{{ entry.site_password }}" required><br>
        <button type="submit">Update</button>
    </form>
</body>
</html>
