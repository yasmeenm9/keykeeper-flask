{% extends 'layout.html' %}
{% block title %}Profile | KeyKeeper{% endblock %}
{% block extra_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='style/profile.css') }}">
{% endblock %}
{% block content %}

<div class="container profile-page">
    <div class="profile-header">
        <h2>Profile</h2>
        <div class="profile-info">
          <!-- <img src="{{ user.profile_picture }}" alt="Profile Picture" class="profile-picture">--> 
            <div class="user-details">
                <p><strong>Email:</strong> {{ user.email }}</p>
            </div>
        </div>
    </div>

    <div class="profile-actions">
        <button class="btn btn-danger" onclick="window.location.href='/delete_account'">Delete Account</button>
    </div>

    <div class="password-change-section">
        <h3>Change Password</h3>
        <form method="POST" action="/change_password">
            <div class="form-group">
                <label for="current_password">Current Password:</label>
                <input type="password" id="current_password" name="current_password" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="new_password">New Password:</label>
                <input type="password" id="new_password" name="new_password" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password:</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
            </div>
            <button type="submit" class="btn-success">Change Password</button>
        </form>
    </div>
</div>
{% endblock %}
